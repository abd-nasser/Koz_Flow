{% load static %}
<dialog id="login_simple_modal" class="modal modal-bottom sm:modal-middle backdrop-blur-sm bg-slate-900/40 transition-all duration-300">
    <div class="modal-box p-0 rounded-2xl bg-white border border-slate-200/90 shadow-2xl shadow-slate-900/15 overflow-hidden max-w-md w-full relative">
        
        <!-- Barre de dégradé supérieure (Rappel de la charte KOZ) -->
        <div class="h-1.5 bg-gradient-to-r from-blue-700 via-indigo-600 to-sky-500 w-full"></div>

        <div class="p-6 sm:p-8">
            <!-- Header du Modal -->
            <div class="flex justify-between items-start mb-6">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-blue-50 border border-blue-100 flex items-center justify-center text-blue-600 text-lg shadow-sm">
                        <i class="fas fa-user-shield"></i>
                    </div>
                    <div>
                        <h3 class="text-xl font-extrabold text-slate-900 leading-tight">Connexion ERP</h3>
                        <p class="text-xs text-slate-500 mt-0.5">Espace d'administration KOZ Services</p>
                    </div>
                </div>
                <button type="button" 
                        class="w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-400 hover:text-slate-700 transition flex items-center justify-center text-lg leading-none" 
                        onclick="document.getElementById('login_simple_modal').close()">&times;</button>
            </div>

            <!-- Conteneur de retour HTMX -->
            <div id="login_result" class="mb-4"></div>

            <!-- Formulaire HTMX -->
            <form 
                hx-post="{% url 'auth_app:login-simple' %}"
                hx-target="#login_result"
                hx-indicator="#login-indicator"
                class="space-y-4"
            >
                {% csrf_token %}
                
                <!-- Input Email avec icône -->
                <div>
                    <label for="email" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">
                        Adresse Email
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 text-sm">
                            <i class="fas fa-envelope"></i>
                        </div>
                        <input type="email" id="email" name="email" 
                               class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 bg-slate-50/50 text-slate-900 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition-all placeholder:text-slate-400 font-medium" 
                               placeholder="exemple@kozservices.com" required>
                    </div>
                </div>

                <!-- Input Mot de Passe avec Masquage/Affichage -->
                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <label for="password" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider">
                            Mot de passe
                        </label>
                        <a href="#" class="text-xs text-blue-600 hover:text-blue-800 font-medium hover:underline">
                            Mot de passe oublié ?
                        </a>
                    </div>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 text-sm">
                            <i class="fas fa-lock"></i>
                        </div>
                        <input type="password" id="password" name="password" 
                               class="w-full pl-10 pr-10 py-3 rounded-xl border border-slate-200 bg-slate-50/50 text-slate-900 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition-all placeholder:text-slate-400 font-medium" 
                               placeholder="••••••••" required>
                        <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 text-sm">
                            <i id="toggleIcon" class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Overlay de chargement HTMX (Loading Indicator) -->
                <div id="login-indicator" class="htmx-indicator absolute inset-0 bg-white/90 backdrop-blur-sm flex flex-col items-center justify-center z-50 rounded-2xl transition-all">
                    <div class="p-6 text-center flex flex-col items-center">
                        <img src="{% static 'images/Loading_animation.svg' %}" class="w-16 h-16 mb-3 object-contain animate-pulse" alt="Chargement...">
                        <p class="text-sm font-bold text-slate-800">Authentification en cours...</p>
                        <p class="text-xs text-slate-500 mt-1">Connexion sécurisée aux serveurs KOZ Services</p>
                    </div>
                </div>

                <div id="errorMessage" class="p-3 rounded-lg bg-red-50 border border-red-200 text-red-700 text-xs font-medium hidden"></div>

                <!-- Bouton de Soumission -->
                <button type="submit" id="loginBtn" class="w-full py-3.5 px-4 mt-2 rounded-xl bg-gradient-to-r from-blue-700 to-indigo-600 hover:from-blue-800 hover:to-indigo-700 text-white font-semibold shadow-lg shadow-blue-600/20 transition-all duration-200 active:scale-[0.99] flex items-center justify-center gap-2 text-sm">
                    <i class="fas fa-right-to-bracket"></i>
                    <span id="btnText">Se connecter</span>
                    <span id="btnSpinner" class="loading loading-spinner loading-xs hidden"></span>
                </button>
            </form>

            <!-- Pied du modal -->
            <div class="mt-6 pt-4 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500">
                <span class="flex items-center gap-1.5 text-slate-500 font-medium">
                    <i class="fas fa-shield-check text-emerald-600"></i>
                    Protocole HTTPS / SSL
                </span>
                <button type="button" class="text-slate-400 hover:text-slate-700 font-medium transition" onclick="document.getElementById('login_simple_modal').close()">
                    Annuler
                </button>
            </div>
        </div>
    </div>
</dialog>

<style>
    /* Effet d'apparition fondu de l'indicateur HTMX */
    #login-indicator {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease-in-out;
    }

    #login-indicator.htmx-request {
        opacity: 1;
        pointer-events: auto;
    }
</style>

<script>
    // Événement de fermeture personnalisée
    document.addEventListener('closeLoginModal', function() {
        document.getElementById('login_simple_modal').close();
    });

    // Bascule d'affichage du mot de passe
    function togglePasswordVisibility() {
        const pwdInput = document.getElementById('password');
        const icon = document.getElementById('toggleIcon');
        if (pwdInput.type === 'password') {
            pwdInput.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            pwdInput.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }
</script>
