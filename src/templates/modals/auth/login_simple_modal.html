{% load static %}
<dialog id="login_simple_modal" class="modal">
    <div class="modal-box rounded-2xl shadow-2xl transform transition-all duration-300 scrollable-form scale-95">
        <div class="flex justify-between items-center border-b pb-3 mb-4">
            <h3 class="text-xl font-bold text-gray-800">🔐 Connexion</h3>
            <button type="button" class="text-gray-400 hover:text-gray-600 text-2xl leading-none" 
                    onclick="document.getElementById('login_simple_modal').close()">&times;</button>
        </div>
        <div id="login_result" class="mb-4"></div>
        <form 
        hx-post="{% url 'auth_app:login-simple' %}"
        hx-target="#login_result"
        hx-indicator="#login-indicator"
        >
            {% csrf_token %}
            <div class="space-y-4">
                <div>
                    <label class="label text-gray-700 font-medium">Email</label>
                    <input type="email" id="email" name="email" 
                           class="input input-bordered w-full focus:ring-2 focus:ring-blue-500 transition" 
                           placeholder="exemple@kozservices.com" required>
                </div>
                
                <div>
                    <label class="label text-gray-700 font-medium">Mot de passe</label>
                    <input type="password" id="password" name="password" 
                           class="input input-bordered w-full focus:ring-2 focus:ring-blue-500 transition" 
                           placeholder="••••••••" required>
                </div>
                <div id="login-indicator" class="htmx-indicator fixed inset-0  flex items-center justify-center z-50">
                            <div class="bg-white p-6 items-center rounded-xl justify-center text-center shadow-2xl">
                                <img src="{% static 'images/Loading_animation.svg' %}" class="object-cover  w-35 h-35 mb-3">
                                <p class="text-gray-700 font-medium">Connexion...</p>
                            </div>
                        </div>
                
                <div id="errorMessage" class="alert alert-error text-sm hidden"></div>
                
                <button type="submit" id="loginBtn" class="btn btn-primary w-full">
                    <span id="btnText">Se connecter</span>
                    <span id="btnSpinner" class="loading loading-spinner loading-sm hidden"></span>
                </button>
            </div>
        </form>
        
        <div class="text-center mt-4">
            <a href="#" class="text-sm text-blue-600 hover:underline">Mot de passe oublié ?</a>
        </div>
        
        <div class="modal-action mt-4">
            <button type="button" class="btn btn-ghost btn-sm" onclick="document.getElementById('login_simple_modal').close()">
                Annuler
            </button>
        </div>
    </div>
</dialog>

<style>
    /* HTMX indicator visibility during requests */
    #login-indicator {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
    }

    #login-indicator.htmx-request {
        opacity: 1;
        pointer-events: auto;
    }
</style>

<script>
 document.addEventListener('closeLoginModal', function() {
        document.getElementById('login_simple_modal').close();
    });
</script>
