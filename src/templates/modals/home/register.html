{% load static %}
<!-- Modal DaisyUI - Inscription Enterprise -->
<dialog id="register_modal" class="modal modal-bottom sm:modal-middle backdrop-blur-sm bg-slate-900/40 transition-all duration-300">
    <div class="modal-box p-0 rounded-2xl bg-white border border-slate-200/90 shadow-2xl shadow-slate-900/15 max-w-lg w-full max-h-[90vh] flex flex-col relative overflow-hidden">
        
        <!-- Ligne supérieure dégradée KOZ -->
        <div class="h-1.5 bg-gradient-to-r from-blue-700 via-indigo-600 to-sky-500 w-full shrink-0"></div>

        <!-- En-tête Fixe -->
        <div class="p-6 pb-4 border-b border-slate-100 flex items-center justify-between shrink-0 bg-white">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-blue-50 border border-blue-100 flex items-center justify-center text-blue-600 text-lg shadow-sm">
                    <i class="fas fa-user-plus"></i>
                </div>
                <div>
                    <h3 class="text-xl font-extrabold text-slate-900 leading-tight">Créer un compte</h3>
                    <p class="text-xs text-slate-500 mt-0.5">Rejoignez la plateforme KOZ Services</p>
                </div>
            </div>
            <button type="button" 
                    class="w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-400 hover:text-slate-700 transition flex items-center justify-center text-lg leading-none" 
                    onclick="document.getElementById('register_modal').close()">&times;</button>
        </div>

        <!-- Zone de contenu défilante -->
        <div class="p-6 overflow-y-auto flex-grow space-y-4">
            
            <!-- Conteneur de retour HTMX -->
            <div id="register-result"></div>

            <!-- Formulaire HTMX -->
            <form 
                hx-post="{% url 'auth_app:site-register' %}"
                hx-target="#register-result"
                hx-indicator="#register-indicator"
                class="space-y-4 relative"
            >
                {% csrf_token %}

                <!-- Grille 2 Colonnes -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                    
                    <!-- Email (Pleine largeur) -->
                    <div class="sm:col-span-2">
                        <label for="reg_email" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
                            Adresse Email <span class="text-blue-600">*</span>
                        </label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 text-xs">
                                <i class="fas fa-envelope"></i>
                            </div>
                            <input type="email" id="reg_email" name="email" required 
                                   class="w-full pl-9 pr-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50/50 text-slate-900 text-xs focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition-all placeholder:text-slate-400 font-medium" 
                                   placeholder="votre@email.com">
                        </div>
                    </div>

                    <!-- Nom complet -->
                    <div>
                        <label for="reg_nom" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
                            Nom Complet <span class="text-blue-600">*</span>
                        </label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 text-xs">
                                <i class="fas fa-user"></i>
                            </div>
                            <input type="text" id="reg_nom" name="nom_complet" required 
                                   class="w-full pl-9 pr-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50/50 text-slate-900 text-xs focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition-all placeholder:text-slate-400 font-medium" 
                                   placeholder="Nom & Prénom">
                        </div>
                    </div>

                    <!-- Téléphone -->
                    <div>
                        <label for="reg_telephone" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
                            Téléphone <span class="text-blue-600">*</span>
                        </label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 text-xs">
                                <i class="fas fa-phone"></i>
                            </div>
                            <input type="tel" id="reg_telephone" name="telephone" required 
                                   class="w-full pl-9 pr-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50/50 text-slate-900 text-xs focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition-all placeholder:text-slate-400 font-medium" 
                                   placeholder="77 12 34 56">
                        </div>
                    </div>

                    <!-- Pays -->
                    <div>
                        <label for="reg_pays" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
                            Pays <span class="text-blue-600">*</span>
                        </label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 text-xs">
                                <i class="fas fa-globe"></i>
                            </div>
                            <input type="text" id="reg_pays" name="pays" required 
                                   class="w-full pl-9 pr-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50/50 text-slate-900 text-xs focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition-all placeholder:text-slate-400 font-medium" 
                                   placeholder="Burkina Faso">
                        </div>
                    </div>

                    <!-- Ville -->
                    <div>
                        <label for="reg_ville" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
                            Ville <span class="text-blue-600">*</span>
                        </label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 text-xs">
                                <i class="fas fa-city"></i>
                            </div>
                            <input type="text" id="reg_ville" name="ville" required 
                                   class="w-full pl-9 pr-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50/50 text-slate-900 text-xs focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition-all placeholder:text-slate-400 font-medium" 
                                   placeholder="Ouagadougou">
                        </div>
                    </div>

                    <!-- Adresse (Pleine largeur) -->
                    <div class="sm:col-span-2">
                        <label for="reg_adresse" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
                            Adresse Résidentielle
                        </label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 text-xs">
                                <i class="fas fa-location-dot"></i>
                            </div>
                            <input type="text" id="reg_adresse" name="adresse" 
                                   class="w-full pl-9 pr-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50/50 text-slate-900 text-xs focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition-all placeholder:text-slate-400 font-medium" 
                                   placeholder="Rue, Secteur ou Quartier">
                        </div>
                    </div>

                    <!-- Genre -->
                    <div>
                        <label for="reg_genre" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
                            Genre
                        </label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 text-xs">
                                <i class="fas fa-venus-mars"></i>
                            </div>
                            <select id="reg_genre" name="genre" class="w-full pl-9 pr-8 py-2.5 rounded-xl border border-slate-200 bg-slate-50/50 text-slate-900 text-xs focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition-all font-medium appearance-none cursor-pointer">
                                <option value="">Sélectionner</option>
                                <option value="M">Masculin</option>
                                <option value="F">Féminin</option>
                            </select>
                            <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-slate-400 text-xs">
                                <i class="fas fa-chevron-down"></i>
                            </div>
                        </div>
                    </div>

                    <!-- Profession -->
                    <div>
                        <label for="reg_profession" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
                            Profession
                        </label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 text-xs">
                                <i class="fas fa-briefcase"></i>
                            </div>
                            <select id="reg_profession" name="profession" class="w-full pl-9 pr-8 py-2.5 rounded-xl border border-slate-200 bg-slate-50/50 text-slate-900 text-xs focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition-all font-medium appearance-none cursor-pointer">
                                <option value="">Sélectionner</option>
                                <option value="employe">Employé</option>
                                <option value="chef_d_equipe">Chef d'équipe</option>
                                <option value="gerant">Gérant</option>
                                <option value="etudiant">Étudiant</option>
                                <option value="autre">Autre</option>
                            </select>
                            <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-slate-400 text-xs">
                                <i class="fas fa-chevron-down"></i>
                            </div>
                        </div>
                    </div>

                    <!-- Mot de passe -->
                    <div>
                        <label for="reg_password" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
                            Mot de passe <span class="text-blue-600">*</span>
                        </label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 text-xs">
                                <i class="fas fa-lock"></i>
                            </div>
                            <input type="password" id="password" name="password" required 
                                   class="w-full pl-9 pr-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50/50 text-slate-900 text-xs focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition-all placeholder:text-slate-400 font-medium" 
                                   placeholder="••••••••">
                            <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 text-sm">
                            <i id="toggleIcon" class="fas fa-eye"></i>
                        </button>
                        </div>
                    </div>

                    <!-- Confirmer Mot de passe -->
                    <div>
                        <label for="reg_password2" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
                            Confirmation <span class="text-blue-600">*</span>
                        </label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 text-xs">
                                <i class="fas fa-shield-halved"></i>
                            </div>
                            <input type="password" id="password_2" name="password2" required 
                                   class="w-full pl-9 pr-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50/50 text-slate-900 text-xs focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition-all placeholder:text-slate-400 font-medium" 
                                   placeholder="••••••••">
                             <button type="button" onclick="togglePasswordVisibility2()" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 text-sm">
                            <i id="toggleIcon2" class="fas fa-eye"></i>
                        </div>
                    </div>

                </div>

                <!-- Overlay de Chargement HTMX -->
                <div id="register-indicator" class="htmx-indicator absolute inset-0 bg-white/95 backdrop-blur-sm flex flex-col items-center justify-center z-50 rounded-xl transition-all">
                    <div class="p-6 text-center flex flex-col items-center">
                        <img src="{% static 'images/Loading_animation.svg' %}" class="w-16 h-16 mb-3 object-contain animate-pulse" alt="Chargement...">
                        <p class="text-sm font-bold text-slate-800">Inscription en cours...</p>
                        <p class="text-xs text-slate-500 mt-1">Création de votre profil sécurisé KOZ Services</p>
                    </div>
                </div>

                <!-- Indicator de fallback hérité -->
                <div id="registerSpinner" class="hidden text-center text-slate-500 text-xs py-1">
                    <i class="fas fa-spinner fa-spin mr-1.5 text-blue-600"></i> Traitement de l'inscription...
                </div>

                <!-- Boutons d'Action -->
                <div class="pt-3 flex items-center gap-3">
                    <button type="submit" id="registerBtn" 
                            class="flex-1 py-3 px-4 rounded-xl bg-gradient-to-r from-blue-700 to-indigo-600 hover:from-blue-800 hover:to-indigo-700 text-white font-semibold shadow-lg shadow-blue-600/20 transition-all duration-200 active:scale-[0.99] flex items-center justify-center gap-2 text-xs">
                        <i class="fas fa-user-plus"></i>
                        <span>Créer mon compte</span>
                    </button>
                    <button type="button" 
                            onclick="document.getElementById('register_modal').close()" 
                            class="py-3 px-4 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold transition text-xs">
                        Annuler
                    </button>
                </div>

            </form>
        </div>

        <!-- Footer / Lien vers Connexion -->
        <div class="p-4 bg-slate-50 border-t border-slate-100 text-center text-xs text-slate-500 shrink-0">
            Déjà inscrit sur KOZ Services ? 
            <button type="button" 
                    onclick="document.getElementById('register_modal').close(); document.getElementById('login_simple_modal').showModal();" 
                    class="text-blue-600 hover:text-blue-800 font-bold hover:underline ml-1">
                Se connecter
            </button>
        </div>

    </div>

    <!-- Fermeture clic extérieur -->
    <form method="dialog" class="modal-backdrop">
        <button type="submit">fermer</button>
    </form>
</dialog>

<style>
    /* Visibilité de l'indicateur HTMX lors de la requête */
    #register-indicator {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease-in-out;
    }

    #register-indicator.htmx-request {
        opacity: 1;
        pointer-events: auto;
    }
</style>

<script>
    // Événement personnalisé de fermeture
    document.addEventListener('closeRegisterModal', function(){
        document.getElementById('register_modal').close();
    });

     // Bascule d'affichage du mot de passe
    function togglePasswordVisibility() {
        const pwdInput = document.getElementById('password');
        const icon = document.getElementById('toggleIcon');
        if (pwdInput.type === 'password') {
            pwdInput.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            pwdInput.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }

    function togglePasswordVisibility2() {
        const pwdInput = document.getElementById('password_2');
        const icon = document.getElementById('toggleIcon2');
        if (pwdInput.type === 'password') {
            pwdInput.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            pwdInput.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }
</script>
