<dialog id="gestion_maintenance_modal" class="modal modal-bottom sm:modal-middle">
    <div class="modal-box relative p-0 overflow-hidden rounded-2xl bg-base-100 border border-base-200 shadow-2xl max-w-md w-full">
        
        <!-- Header -->
        <div class="bg-gradient-to-r from-primary to-indigo-700 px-6 py-5 text-white">
            <div class="flex justify-between items-center">
                <h3 class="text-lg font-bold flex items-center gap-2">
                    <i class="fas fa-tools text-primary-content/80"></i> Gérer la maintenance
                </h3>
                <form method="dialog">
                    <button class="btn btn-sm btn-circle btn-ghost text-white/80 hover:text-white hover:bg-white/10">✕</button>
                </form>
            </div>
            <p class="text-xs text-white/80 mt-1">Changer le statut de l'intervention #{{ maintenance.id }}</p>
        </div>

        <!-- Indicateur de chargement HTMX -->
        <div id="gestion-spinner" class="htmx-indicator px-6 pt-4 flex items-center justify-center gap-2 text-primary font-medium text-xs">
            <span class="loading loading-spinner loading-xs"></span> Mise à jour du statut...
        </div>

        <!-- Corps du modal (Actions) -->
        <div class="p-6 space-y-3">
            
            <!-- Action : Commencer -->
            <button type="button"
                    hx-post="{% url 'commercial_app:changer-statut-maintenance' maintenance.id 'en_cours' %}"
                    hx-target="#maintenance-card-{{ maintenance.id }}"
                    hx-swap="outerHTML"
                    hx-indicator="#gestion-spinner"
                    hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
                    class="w-full flex items-center gap-4 p-4 rounded-xl bg-warning/10 border border-warning/30 hover:bg-warning/20 transition-all text-left group">
                <div class="w-10 h-10 rounded-xl bg-warning/20 text-warning flex items-center justify-center shrink-0 group-hover:scale-105 transition-transform">
                    <i class="fas fa-play text-base"></i>
                </div>
                <div class="flex-1 min-w-0">
                    <p class="font-semibold text-sm text-base-content">Commencer la maintenance</p>
                    <p class="text-xs text-base-content/60">Passer au statut "En cours"</p>
                </div>
                <i class="fas fa-chevron-right text-xs text-base-content/40 group-hover:translate-x-1 transition-transform"></i>
            </button>

            <!-- Action : Marquer comme effectuée -->
            <button type="button"
                    hx-post="{% url 'commercial_app:changer-statut-maintenance' maintenance.id 'effectuee' %}"
                    hx-target="#maintenance-card-{{ maintenance.id }}"
                    hx-swap="outerHTML"
                    hx-indicator="#gestion-spinner"
                    hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
                    class="w-full flex items-center gap-4 p-4 rounded-xl bg-success/10 border border-success/30 hover:bg-success/20 transition-all text-left group">
                <div class="w-10 h-10 rounded-xl bg-success/20 text-success flex items-center justify-center shrink-0 group-hover:scale-105 transition-transform">
                    <i class="fas fa-check-circle text-base"></i>
                </div>
                <div class="flex-1 min-w-0">
                    <p class="font-semibold text-sm text-base-content">Marquer comme effectuée</p>
                    <p class="text-xs text-base-content/60">L'intervention est terminée</p>
                </div>
                <i class="fas fa-chevron-right text-xs text-base-content/40 group-hover:translate-x-1 transition-transform"></i>
            </button>

            <!-- Action : Annuler -->
            <button type="button"
                    hx-post="{% url 'commercial_app:changer-statut-maintenance' maintenance.id 'annulee' %}"
                    hx-target="#maintenance-card-{{ maintenance.id }}"
                    hx-swap="outerHTML"
                    hx-indicator="#gestion-spinner"
                    hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
                    class="w-full flex items-center gap-4 p-4 rounded-xl bg-error/10 border border-error/30 hover:bg-error/20 transition-all text-left group">
                <div class="w-10 h-10 rounded-xl bg-error/20 text-error flex items-center justify-center shrink-0 group-hover:scale-105 transition-transform">
                    <i class="fas fa-times-circle text-base"></i>
                </div>
                <div class="flex-1 min-w-0">
                    <p class="font-semibold text-sm text-base-content">Annuler la maintenance</p>
                    <p class="text-xs text-base-content/60">L'intervention est annulée</p>
                </div>
                <i class="fas fa-chevron-right text-xs text-base-content/40 group-hover:translate-x-1 transition-transform"></i>
            </button>

        </div>

        <!-- Footer -->
        <div class="bg-base-200/50 px-6 py-3 flex justify-end border-t border-base-200">
            <form method="dialog">
                <button class="btn btn-sm btn-ghost gap-2">
                    <i class="fas fa-times"></i> Fermer
                </button>
            </form>
        </div>

    </div>

    <!-- Clic à l'extérieur pour fermer -->
    <form method="dialog" class="modal-backdrop">
        <button>close</button>
    </form>
</dialog>

<script>
    // Écouteur d'événement envoyé par la vue Django via l'en-tête "HX-Trigger: closeGestMaintenanceModal"
    document.addEventListener('closeGestMaintenanceModal', function() {
        const modal = document.getElementById('gestion_maintenance_modal');
        if (modal && typeof modal.close === 'function') {
            modal.close();
        }
    });
</script>
