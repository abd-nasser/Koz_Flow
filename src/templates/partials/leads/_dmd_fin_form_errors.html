{% load humanize %}
<div class="bg-red-50 border border-red-300 text-red-700 rounded-lg p-3 text-sm">
    <p class="font-semibold mb-1">⚠️ Merci de corriger les erreurs suivantes :</p>
    <ul class="list-disc list-inside">
        {% for field in dmd_fin_form %}
            {% for error in field.errors %}
                <li>{{ field.label }} : {{ error }}</li>
            {% endfor %}
        {% endfor %}
        {% for error in dmd_fin_form.non_field_errors %}
            <li>{{ error }}</li>
        {% endfor %}
    </ul>
</div>
