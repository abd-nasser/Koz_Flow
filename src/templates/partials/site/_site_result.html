{% load static %}
<div id="result-toast-container" class="result-toast-container" hx-swap-oob="innerHTML">
    <!-- Backdrop flouté avec effet d'assombrissement -->
    <div class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm transition-all duration-300">
        
        <!-- Carte de notification -->
        <div class="bg-white rounded-2xl shadow-2xl border border-slate-100 p-6 max-w-sm w-full text-center relative overflow-hidden transform transition-all animate-in fade-in zoom-in-95 duration-200">
            
            <!-- Barre d'accentuation supérieure -->
            <div class="absolute top-0 left-0 right-0 h-1.5 {% if success %}bg-emerald-500{% else %}bg-rose-500{% endif %}"></div>

            <!-- Illustration / SVG / GIF -->
            <div class="my-2 flex justify-center items-center">
                {% if success %}
                    <img src="{% static 'images/youpie.svg' %}" alt="Succès" class="w-28 h-28 object-contain">
                {% else %}
                    <img src="{% static 'images/Sign_for_error.gif' %}" alt="Erreur" class="w-20 h-20 object-contain">
                {% endif %}
            </div>

            <!-- Titre -->
            <h3 class="font-bold text-lg mb-1 tracking-tight {% if success %}text-emerald-600{% else %}text-rose-600{% endif %}">
                {{ title }}
            </h3>

            <!-- Message de réponse -->
            <p class="text-sm text-slate-600 leading-relaxed px-2 mb-6">
                {{ message }}
            </p>

            <!-- Bouton de fermeture / Action -->
            <button type="button"
                    onclick="document.getElementById('result-toast-container').innerHTML = ''" 
                    class="w-full py-2.5 px-4 rounded-xl text-xs font-semibold text-white transition-all shadow-sm active:scale-95
                           {% if success %}bg-emerald-600 hover:bg-emerald-700 shadow-emerald-200{% else %}bg-rose-600 hover:bg-rose-700 shadow-rose-200{% endif %}">
                {% if success %}Continuer{% else %}Fermer{% endif %}
            </button>
        </div>
    </div>
</div>

<script>
(function() {
    if (window._toastTimeout) clearTimeout(window._toastTimeout);

    requestAnimationFrame(function() {
        const bar = document.getElementById('toast-progress-bar');
        if (bar) bar.style.width = '0%';
    });

    window._toastTimeout = setTimeout(function() {
        closeResultToast({{ reload_on_close|yesno:'true,false' }});
    }, 4000);
})();

function closeResultToast(shouldReload) {
    if (window._toastTimeout) {
        clearTimeout(window._toastTimeout);
        window._toastTimeout = null;
    }
    const container = document.getElementById('result-toast-container');
    if (container) container.innerHTML = '';

    if (shouldReload) {
        window.location.reload();
    }
}
</script>

<script>
    gsap.registerPlugin(ScrollTrigger);
    gsap.from("#result-toast-container .bg-white", {
        opacity: 0,
        scale: 0,
        rotation: -15,
        duration: 2,
        ease: "elastic.out(1, 0.4)"
    });
</script>
