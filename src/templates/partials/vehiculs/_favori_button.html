<button
    id="fav-btn-{{ vehicul.pk }}"
    hx-post="{% url 'vehicul_app:ajout-favoris' vehicul.pk %}"
    hx-target="#fav-btn-{{ vehicul.pk }}"
    hx-swap="outerHTML transition:true"
    hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
    type="button"
    class="block w-full text-center cursor-pointer py-3.5 rounded-xl font-semibold transition border
        {% if request.user in vehicul.favoris_de.all %}
            bg-rose-50 hover:bg-rose-100 text-rose-600 border-rose-100
        {% else %}
            bg-gray-50 hover:bg-gray-100 text-gray-600 border-gray-100
        {% endif %}">
    {% if request.user in vehicul.favoris_de.all %}
        <i class="fas fa-heart mr-2"></i> Retirer des favoris
    {% else %}
        <i class="far fa-heart mr-2"></i> Ajouter aux favoris
    {% endif %}
</button>
